[package]
name = "ojb-setup"
description = "OpenJewelleryBhy Windows installer (per-user, no admin rights)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "OpenJewelleryBhy-setup"
path = "src/main.rs"

[dependencies]
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
