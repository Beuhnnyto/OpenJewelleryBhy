[package]
name = "ojb-app"
description = "OpenJewelleryBhy desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openjewellerybhy"
path = "src/main.rs"

[dependencies]
ojb-core = { path = "../ojb-core" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui_extras = { version = "0.36", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.17"
serde_json.workspace = true
serde.workspace = true
glam.workspace = true
