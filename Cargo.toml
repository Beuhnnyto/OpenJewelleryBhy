[workspace]
resolver = "2"
members = ["crates/ojb-core", "crates/ojb-cli", "crates/ojb-app", "crates/ojb-setup"]
default-members = ["crates/ojb-core", "crates/ojb-cli", "crates/ojb-app", "crates/ojb-setup"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/your-org/OpenJewelleryBhy"
rust-version = "1.80"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
thiserror = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
png = "0.17"
ttf-parser = "0.25"
earcutr = "0.5"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Keep debug builds usable: geometry kernels are very slow unoptimised.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.ojb-core]
opt-level = 2
